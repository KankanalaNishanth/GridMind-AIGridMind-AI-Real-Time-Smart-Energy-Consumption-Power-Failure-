services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gridmind-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=gridmind_ai
      - ENVIRONMENT=production
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./data:/app/data:ro
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: gridmind-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongo_data:
